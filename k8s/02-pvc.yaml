apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: clusterdrive
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: clusterdrive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi

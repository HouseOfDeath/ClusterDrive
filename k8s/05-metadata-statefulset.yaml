apiVersion: v1
kind: Service
metadata:
  name: metadata-hs
  namespace: clusterdrive
  labels:
    app.kubernetes.io/name: metadata
    app.kubernetes.io/component: metadata
    app.kubernetes.io/part-of: clusterdrive
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: metadata
  ports:
    - port: 50161
      targetPort: 50161
      name: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: metadata
  namespace: clusterdrive
  labels:
    app.kubernetes.io/name: metadata
    app.kubernetes.io/component: metadata
    app.kubernetes.io/part-of: clusterdrive
spec:
  serviceName: metadata-hs
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata
        app.kubernetes.io/component: metadata
        app.kubernetes.io/part-of: clusterdrive
    spec:
      containers:
        - name: metadata-node
          image: clusterdive-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              POD_INDEX=${HOSTNAME##*-}
              NODE_ID=$(printf "metadata-%02d" $((POD_INDEX + 1)))
              echo "Starting Raft metadata node ${NODE_ID} on pod ${HOSTNAME}..."
              exec python -m backend.metadata.server --node-id "${NODE_ID}"
          envFrom:
            - configMapRef:
                name: clusterdrive-config
          ports:
            - containerPort: 50161
              name: grpc
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: metadata-data
              mountPath: /app/data/metadata-nodes
          livenessProbe:
            tcpSocket:
              port: 50161
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 50161
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
  volumeClaimTemplates:
    - metadata:
        name: metadata-data
        labels:
          app.kubernetes.io/name: metadata
          app.kubernetes.io/part-of: clusterdrive
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 256Mi


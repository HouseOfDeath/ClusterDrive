apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: clusterdrive
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: clusterdrive
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: clusterdrive
    spec:
      containers:
        - name: api
          image: clusterdive-backend:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - uvicorn
            - backend.app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          envFrom:
            - configMapRef:
                name: clusterdrive-config
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: api-catalog
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: api-catalog
          persistentVolumeClaim:
            claimName: api-catalog-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: clusterdrive
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: clusterdrive
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: api
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30081
      name: http


syntax = "proto3";

package clusterdive.metadata.v1;

service RaftPeer {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  rpc GetStatus(GetStatusRequest) returns (NodeStatus);
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  string command_json = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 previous_log_index = 3;
  uint64 previous_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
}

message ProposeRequest {
  string operation_json = 1;
}

message ProposeResponse {
  bool accepted = 1;
  bool committed = 2;
  uint64 term = 3;
  uint64 index = 4;
  string leader_id = 5;
  string error = 6;
}

message GetStatusRequest {}

message NodeStatus {
  string node_id = 1;
  string role = 2;
  uint64 term = 3;
  string leader_id = 4;
  uint64 commit_index = 5;
  uint64 last_applied = 6;
  uint64 last_log_index = 7;
  uint64 last_log_term = 8;
  uint64 heartbeat_age_ms = 9;
  repeated LogEntry recent_entries = 10;
}
